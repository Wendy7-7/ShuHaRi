name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建前端
        run: npm run build

      - name: Rust 单元测试（判题器核心 + 沙盒）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: 构建 exe
        run: npm run tauri build -- --no-bundle

      - name: exe 启动自检（防白窗口坏包）
        run: |
          $exe = "src-tauri/target/release/learn-platform.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe 启动即退出 code=$($p.ExitCode)"; exit 1 }
          "进程存活 PID=$($p.Id) 窗口标题=$($p.MainWindowTitle)"
          if (-not (Test-Path "src-tauri/target/release/Data/learn.db")) { Write-Error "DB 未创建"; exit 1 }
          Stop-Process -Id $p.Id -Force

  # 打 tag（v*）自动发版：编译 exe -> 组装基础包 -> 挂到 GitHub Release
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: build-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 构建 exe
        run: npm run tauri build -- --no-bundle

      - name: exe 启动自检（防白窗口坏包）
        run: |
          $exe = "src-tauri/target/release/learn-platform.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "exe 启动即退出，code=$($p.ExitCode)"; exit 1 }
          "进程存活 PID=$($p.Id)，窗口标题=$($p.MainWindowTitle)"
          $db = "src-tauri/target/release/Data/learn.db"
          if (-not (Test-Path $db)) { Write-Error "数据库未创建"; exit 1 }
          "数据库已创建 ✓"
          Stop-Process -Id $p.Id -Force

      - name: 组装基础包（exe + 工作区模板 + 说明）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          python scripts/build-base.py "src-tauri/target/release/learn-platform.exe" "release/LearnPlatform-$ver-base.zip" $ver

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/LearnPlatform-*-base.zip
            src-tauri/target/release/learn-platform.exe
          body: |
            基础包已自动构建：`LearnPlatform-${{ github.ref_name }}-base.zip`（解压即用，内置 SQL 判题）。

            > 语言包（langpack-*.zip）由维护者用 `build-langpacks.py` 在本地构建后手工上传——
            > 工具链快照不进 CI（省 400MB+ 下载与构建时间），构建脚本入库可复现。
