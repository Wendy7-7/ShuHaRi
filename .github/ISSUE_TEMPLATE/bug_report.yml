name: Bug 报告 / Bug Report
description: 软件打不开、判题异常、界面报错等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先看 [README 常见问题](https://github.com/Wendy7-7/ShuHaRi#下载教学手把手版)——
        尤其是「白屏 / 双击没反应」那一条（90% 的白屏是 EBWebView 缓存问题）。

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 软件打不开 / 白屏 / 闪退
        - 判题失败 / 判题结果不对
        - 语言包安装失败
        - AI 助教不工作
        - 界面显示 / 交互问题
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 「设置」页面底部可见，或看下载的 zip 文件名
      placeholder: 例如 v1.5.1
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 (22631)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 做了什么操作，第几步出的问题
      placeholder: |
        1. 打开软件
        2. 点「题库练习」
        3. 选 Python 第一题
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果 vs 实际结果
      placeholder: |
        期望：判题显示 3/3 通过
        实际：一直显示「编译失败」，报错如下…
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 截图 / 错误文字
      description: 直接把截图粘贴到这个框里即可
    validations:
      required: false

  - type: checkboxes
    id: tried
    attributes:
      label: 已尝试
      options:
        - label: 已删除 EBWebView 缓存目录并重试
        - label: 已重启电脑
        - label: 已查看「帮助 → 环境体检」
