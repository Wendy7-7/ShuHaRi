<!DOCTYPE html>
<!-- ShuHaRi playground · deployed: 2026-11-24 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShuHaRi · 守破离 — 在线试玩</title>
<meta name="description" content="3 分钟在线试玩：判题不只告诉你对错，答错时像教练一样先问你一句。8 道题含 3 道 SQL 真跑。">
<meta property="og:title" content="ShuHaRi · 守破离 — 在线试玩">
<meta property="og:description" content="8 道编程题，浏览器里直接判。答错不会只告诉你「错误」，而是先问你一句。">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f14'/%3E%3Ctext x='50%25' y='54%25' font-size='34' text-anchor='middle' dominant-baseline='middle' fill='%234fc1ff' font-family='monospace'%3E%E5%AE%88%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --line:#1f2a37; --text:#e6edf3; --dim:#8b98a5;
    --accent:#4fc1ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.65;
       -webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);
         position:sticky;top:0;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);z-index:10}
  .brand{font-weight:700;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .tag{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .spacer{flex:1}
  .langbtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;
           padding:4px 10px;font-size:12px;cursor:pointer}
  .langbtn:hover{color:var(--text);border-color:var(--dim)}
  main{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:26px;line-height:1.35;margin:8px 0 10px}
  h1 em{color:var(--accent);font-style:normal}
  .lead{color:var(--dim);margin:0 0 18px}
  .progress{display:flex;align-items:center;gap:10px;margin:18px 0 22px;font-size:13px;color:var(--dim)}
  .bar{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#7ee787);
         transition:width .4s ease}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:0 0 16px}
  .card.done{border-color:rgba(63,185,80,.45)}
  .qhead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .qhead b{color:var(--text);font-size:13px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .chip.sql{color:var(--warn);border-color:rgba(210,153,34,.4)}
  .qtitle{font-size:15px;margin:0 0 10px}
  pre{background:#070a0e;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
      overflow:auto;font-family:var(--mono);font-size:13px;margin:0 0 12px}
  .hint{color:var(--dim);font-size:13px;margin:0 0 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input,textarea{background:#070a0e;border:1px solid var(--line);border-radius:8px;color:var(--text);
                 padding:9px 12px;font-family:var(--mono);font-size:13px;width:100%;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:84px}
  .btn{background:var(--accent);color:#03121b;border:none;border-radius:8px;padding:9px 18px;
       font-size:14px;font-weight:600;cursor:pointer;display:inline-block}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:400}
  .btn.ghost:hover{color:var(--text);border-color:var(--dim)}
  .fb{margin-top:12px;border-radius:8px;padding:12px 14px;font-size:14px;display:none}
  .fb.show{display:block}
  .fb.ok{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.35)}
  .fb.bad{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.35)}
  .fb b{display:block;margin-bottom:4px}
  .fb .who{font-size:12px;color:var(--dim);margin-bottom:6px}
  .solve{display:none;margin-top:10px}
  .solve pre{margin:6px 0 0}
  #cta{display:none;text-align:center;padding:32px 18px;margin-top:28px;
       background:linear-gradient(180deg,var(--panel),#0e141c);border:1px solid var(--line);border-radius:14px}
  #cta h2{margin:0 0 8px;font-size:22px}
  #cta p{color:var(--dim);margin:0 0 18px}
  #cta .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  footer{max-width:820px;margin:0 auto;padding:0 20px 48px;color:var(--dim);font-size:12px;
         display:flex;gap:16px;flex-wrap:wrap}
  code{font-family:var(--mono);font-size:.92em;background:#070a0e;border:1px solid var(--line);
       padding:1px 5px;border-radius:4px}
  @media (max-width:560px){
    h1{font-size:21px} .card{padding:14px} pre{font-size:12px} main{padding:20px 14px 60px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">ShuHaRi · <span>守破离</span></div>
  <div class="tag" id="tagline">在线试玩 · 无需安装</div>
  <div class="spacer"></div>
  <button class="langbtn" id="langBtn">EN</button>
</header>

<main>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>

  <div class="progress">
    <span id="pLabel"></span>
    <div class="bar"><i id="pBar"></i></div>
  </div>

  <div id="quiz"></div>

  <section id="cta">
    <h2 id="ctaTitle"></h2>
    <p id="ctaText"></p>
    <div class="btns">
      <a class="btn" id="ctaDownload" target="_blank" rel="noopener"></a>
      <a class="btn ghost" id="ctaGithub" target="_blank" rel="noopener">GitHub ★</a>
    </div>
  </section>
</main>

<footer>
  <span id="foot1"></span>
  <a href="https://github.com/Wendy7-7/ShuHaRi" target="_blank" rel="noopener">github.com/Wendy7-7/ShuHaRi</a>
</footer>

<script src="sql-wasm.js"></script>
<script>
"use strict";
const REPO = "https://github.com/Wendy7-7/ShuHaRi";
const DL = REPO + "/releases/download/v1.5.2/LearnPlatform-1.5.2-base.zip";

const T = {
  zh: {
    tagline: "在线试玩 · 无需安装",
    h1: '3 分钟，试试<em>只告诉你「答案错误」以外的判题</em>',
    lead: '下面 8 道题全部在浏览器里判。答错时不会甩你一句"错误"，而是像教练一样先问你一句。',
    progress: (a, b) => `进度 ${a} / ${b}`,
    run: "判题", runSql: "运行 SQL", show: "看解答", next: "下一题",
    correct: "✓ 对了", wrong: "✗ 再想想", coach: "教练说",
    answerIs: "正确答案：",
    ctaTitle: "这就是 ShuHaRi 的判题逻辑",
    ctaText: "完整版是离线桌面软件：8 种语言、65 道题、错题变体重做、AI 教练。解压即用，不联网也能做题。",
    ctaDownload: "下载完整版（8MB）",
    foot: "这是 ShuHaRi 的网页试玩版——完整功能在桌面版里。",
    inputPh: "输入程序输出（一行）",
    sqlPh: "在这里写 SQL，然后点「运行 SQL」",
  },
  en: {
    tagline: "Playground · no install",
    h1: 'Three minutes to try <em>judging that says more than "Wrong Answer"</em>',
    lead: 'All 8 problems are judged in your browser. Get it wrong and the coach asks you a question instead of just saying "wrong".',
    progress: (a, b) => `Progress ${a} / ${b}`,
    run: "Judge", runSql: "Run SQL", show: "Show solution",
    correct: "✓ Correct", wrong: "✗ Think again", coach: "The coach says",
    answerIs: "Answer: ",
    ctaTitle: "That's how ShuHaRi judges",
    ctaText: "The full version is an offline desktop app: 8 languages, 65 problems, mistake variant redo, AI coach. Unzip and run — works offline.",
    ctaDownload: "Download full app (8MB)",
    foot: "This is the web playground — the real thing is the desktop app.",
    inputPh: "Type the program output (one line)",
    sqlPh: "Write SQL here, then hit Run SQL",
  },
};

const QUESSETUP = `
CREATE TABLE students (name TEXT, score INTEGER);
INSERT INTO students VALUES
  ('Ada', 92), ('Bob', 71), ('Chen', 58), ('Dana', 88), ('Eli', 45);
`;

const QUIZ = [
  {
    id: "c1", lang: "C", type: "output",
    code: '#include <stdio.h>\nint main(void) {\n    int a = 3, b = 2;\n    printf("%d\\n", a / b);\n    return 0;\n}',
    answer: "1",
    q: { zh: "这段 C 程序输出什么？", en: "What does this C program print?" },
    hint: { zh: "两个 int 相除，结果还是 int——那 0.5 去哪了？", en: "int divided by int stays int — where did the 0.5 go?" },
    explain: { zh: "整数除法直接砍掉小数部分：3 / 2 得到 1。想得到 1.5，得让至少一边是浮点，比如 3.0 / 2。这是 C 新手第一个下午踩的坑。", en: "Integer division truncates: 3 / 2 is 1. For 1.5 you need a float on one side, e.g. 3.0 / 2. Classic first-afternoon bug in C." },
  },
  {
    id: "c2", lang: "C", type: "output",
    code: '#include <stdio.h>\nint main(void) {\n    int x = 5;\n    int y = x++;\n    printf("%d %d\\n", x, y);\n    return 0;\n}',
    answer: "6 5",
    q: { zh: "x++ 是先加还是先用？输出什么？", en: "Does x++ add before or after use? What's printed?" },
    hint: { zh: "++ 写在变量后面，那是「先把旧值交出去，再自己加一」。", en: "When ++ comes after the variable, the old value is handed over first, then incremented." },
    explain: { zh: "x++ 是后自增：y 先拿到 5，然后 x 才变成 6。所以输出 6 5。要反过来写 ++x。", en: "Post-increment: y receives 5 first, then x becomes 6 — output 6 5. Prefix ++x gives 6 6." },
  },
  {
    id: "p1", lang: "Python", type: "output",
    code: 'print(0.1 + 0.2 == 0.3)',
    answer: "False",
    q: { zh: "0.1 + 0.2 等于 0.3 吗？", en: "Is 0.1 + 0.2 equal to 0.3?" },
    hint: { zh: "别用数学直觉——想想 0.1 在二进制里怎么存。", en: "Don't use math intuition — think how 0.1 is stored in binary." },
    explain: { zh: "False。0.1 和 0.2 在二进制浮点里都没有精确表示，加起来是 0.30000000000000004。这不是 Python 的 bug，是所有 IEEE 754 语言的日常（所以比较浮点要用容差）。", en: "False. 0.1 and 0.2 have no exact binary form; their sum is 0.30000000000000004. Not a Python bug — everyday IEEE 754. Compare floats with a tolerance." },
  },
  {
    id: "p2", lang: "Python", type: "output",
    code: 'a = [1]\nb = a\nb.append(2)\nprint(len(a))',
    answer: "2",
    q: { zh: "b 改了，a 为什么也会变？", en: "b changed — why did a change too?" },
    hint: { zh: "b = a 复制的是那个列表，还是「指向列表的箭头」？", en: "Does b = a copy the list, or copy the arrow pointing at it?" },
    explain: { zh: "2。b = a 没复制列表，只是让 b 也指向同一个列表——两个名字，一个对象。想要独立副本用 b = a.copy() 或 a[:]。", en: "2. b = a doesn't copy the list, it points b at the same object — two names, one list. Use b = a.copy() for an independent copy." },
  },
  {
    id: "p3", lang: "Python", type: "output",
    code: 's = "ShuHaRi"\nprint(s[::-1])',
    answer: "iRaHuS",
    q: { zh: "切片里的 -1 步长做了什么？", en: "What does a step of -1 do in a slice?" },
    hint: { zh: "切片是 [起点:终点:步长]，步长 -1 意味着从尾往头走。", en: "A slice is [start:stop:step]; step -1 walks from end to start." },
    explain: { zh: "iRaHuS。步长 -1 就是倒序遍历字符串——Python 里的「反转字符串」标准写法。", en: "iRaHuS. Step -1 iterates backwards — the idiomatic way to reverse a string in Python." },
  },
  {
    id: "sql1", lang: "SQL", type: "sql",
    setup: QUESSETUP,
    q: { zh: "查出及格（≥60 分）的学生一共几人——写一条 SQL。", en: "Count how many students scored >= 60. Write the SQL." },
    hint: { zh: "要数人数用 count(*)，筛选用 where。", en: "count(*) counts rows; where filters." },
    explain: { zh: "SELECT count(*) FROM students WHERE score >= 60; → 3（Ada、Bob、Dana）。SQL 判题是 ShuHaRi 内置的，零配置。", en: "SELECT count(*) FROM students WHERE score >= 60; → 3 (Ada, Bob, Dana). SQL judging ships built-in, zero setup." },
    expect: [["3"]],
    solution: "SELECT count(*) FROM students WHERE score >= 60;",
  },
  {
    id: "sql2", lang: "SQL", type: "sql",
    setup: QUESSETUP,
    q: { zh: "查出分数最高的学生姓名。", en: "Find the name of the top scorer." },
    hint: { zh: "排序取第一条——order by 加 limit。", en: "Sort and take the first row — order by plus limit." },
    explain: { zh: "SELECT name FROM students ORDER BY score DESC LIMIT 1; → Ada。", en: "SELECT name FROM students ORDER BY score DESC LIMIT 1; → Ada." },
    expect: [["Ada"]],
    solution: "SELECT name FROM students ORDER BY score DESC LIMIT 1;",
  },
  {
    id: "sql3", lang: "SQL", type: "sql",
    setup: QUESSETUP,
    q: { zh: "查出不及格（<60 分）的学生姓名，按分数从低到高排。", en: "List failing students (<60), lowest score first." },
    hint: { zh: "筛选 + order by（默认升序）。", en: "Filter then order by (ascending by default)." },
    explain: { zh: "SELECT name FROM students WHERE score < 60 ORDER BY score; → Eli、Chen。", en: "SELECT name FROM students WHERE score < 60 ORDER BY score; → Eli, Chen." },
    expect: [["Eli"], ["Chen"]],
    solution: "SELECT name FROM students WHERE score < 60 ORDER BY score;",
  },
];

let lang = (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
let solved = new Set();
let tried = {};
let drafts = {}; // 输入草稿：重绘/切语言后不丢
let SQL = null;
const t = () => T[lang];

async function initSql() {
  if (typeof initSqlJs !== "function") return null;
  try { return await initSqlJs({ locateFile: (f) => f }); }
  catch (e) { console.warn("sql.js failed", e); return null; }
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

function render() {
  const L = t();
  document.getElementById("tagline").textContent = L.tagline;
  document.getElementById("h1").innerHTML = L.h1;
  document.getElementById("lead").textContent = L.lead;
  document.getElementById("langBtn").textContent = lang === "zh" ? "EN" : "中文";
  document.getElementById("pLabel").textContent = L.progress(solved.size, QUIZ.length);
  document.getElementById("pBar").style.width = (solved.size / QUIZ.length) * 100 + "%";
  document.getElementById("ctaTitle").textContent = L.ctaTitle;
  document.getElementById("ctaText").textContent = L.ctaText;
  const dl = document.getElementById("ctaDownload");
  dl.textContent = L.ctaDownload; dl.href = DL;
  document.getElementById("ctaGithub").textContent = lang === "zh" ? "GitHub 主页 ★" : "Star on GitHub ★";
  document.getElementById("foot1").textContent = L.foot;
  document.getElementById("cta").style.display = solved.size === QUIZ.length ? "block" : "none";

  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  QUIZ.forEach((q, idx) => {
    const done = solved.has(q.id);
    const card = document.createElement("div");
    card.className = "card" + (done ? " done" : "");
    card.innerHTML =
      '<div class="qhead"><b>' + (idx + 1) + " / " + QUIZ.length + '</b>' +
      '<span class="chip ' + (q.type === "sql" ? "sql" : "") + '">' + q.lang + "</span>" +
      '<span class="chip">' + (q.type === "sql" ? (lang === "zh" ? "SQL 真跑" : "SQL live") : (lang === "zh" ? "猜输出" : "output")) + "</span></div>" +
      '<p class="qtitle">' + esc(q.q[lang]) + "</p>" +
      (q.type === "sql"
        ? '<p class="hint">' + (lang === "zh" ? "表：" : "Table: ") + '<code>students(name, score)</code> — Ada 92, Bob 71, Chen 58, Dana 88, Eli 45</p>'
        : "<pre>" + esc(q.code) + "</pre>") +
      (q.type === "sql"
        ? '<textarea id="in-' + q.id + '" placeholder="' + esc(t().sqlPh) + '"></textarea>'
        : '<input id="in-' + q.id + '" placeholder="' + esc(t().inputPh) + '" />') +
      '<div class="row" style="margin-top:10px">' +
      '<button class="btn" data-run="' + q.id + '">' + (q.type === "sql" ? t().runSql : t().run) + "</button>" +
      '<button class="btn ghost solve-btn" data-solve="' + q.id + '" style="display:none">' + t().show + "</button>" +
      "</div>" +
      (done
        ? '<div class="fb show ok" style="margin-top:10px"><b>' + t().correct + '</b><div class="who">' + t().coach + "：</div><div>" + esc(q.explain[lang]) + "</div></div>"
        : (tried[q.id] >= 2
            ? '<div class="fb show bad" id="fb-' + q.id + '"></div><div class="solve" style="display:block"><b>' + t().answerIs + "</b><pre>" + esc(q.solution || q.answer) + "</pre></div>"
            : '<div class="fb" id="fb-' + q.id + '"></div>')) +
      "</div>";
    quiz.appendChild(card);
  });
  quiz.querySelectorAll("[data-run]").forEach((b) => b.addEventListener("click", () => handleJudge(b.getAttribute("data-run"))));
  quiz.querySelectorAll("[data-solve]").forEach((b) => b.addEventListener("click", () => showSolution(b.getAttribute("data-solve"))));
  quiz.querySelectorAll("input, textarea").forEach((inp) => {
    const qid = inp.id.replace("in-", "");
    if (drafts[qid]) inp.value = drafts[qid];
    inp.addEventListener("input", () => { drafts[qid] = inp.value; });
    inp.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && inp.tagName === "INPUT") handleJudge(qid);
    });
  });
  // 已看过解答的题：按钮不再显示
  QUIZ.forEach((q) => {
    if (tried[q.id] >= 2) {
      const b = document.querySelector('[data-solve="' + q.id + '"]');
      if (b) b.style.display = "none";
    }
  });
}

function norm(s) { return String(s).trim().replace(/\s+/g, " "); }

function feedback(qid, ok, coachText, extraHtml) {
  const box = document.getElementById("fb-" + qid);
  const L = t();
  box.className = "fb show " + (ok ? "ok" : "bad");
  box.innerHTML = "<b>" + (ok ? L.correct : L.wrong) + "</b>" +
    '<div class="who">' + L.coach + (lang === "zh" ? "：" : ": ") + "</div>" +
    "<div>" + esc(coachText) + "</div>" + (extraHtml || "");
}

function showSolution(qid) {
  const box = document.getElementById("fb-" + qid);
  const sol = box.querySelector(".solve");
  if (sol) sol.style.display = "block";
  const btn = document.querySelector('[data-solve="' + qid + '"]');
  if (btn) btn.style.display = "none";
}

async function handleJudge(qid) {
  const q = QUIZ.find((x) => x.id === qid);
  const input = document.getElementById("in-" + qid);
  const val = input ? input.value : "";
  if (!val.trim()) return;

  if (q.type === "output") {
    if (norm(val) === norm(q.answer)) {
      solved.add(qid);
      render();
      const card = document.querySelectorAll(".card")[QUIZ.findIndex((x) => x.id === qid)];
      if (card) setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "center" }), 60);
      if (solved.size === QUIZ.length) setTimeout(() => document.getElementById("cta").scrollIntoView({ behavior: "smooth", block: "center" }), 400);
      return;
    }
  } else {
    if (!SQL) {
      feedback(qid, false, lang === "zh"
        ? "SQL 运行时没加载成功（可能离线或被拦）——完整版桌面软件内置 SQL 判题，不受网络影响。"
        : "SQL runtime failed to load (offline or blocked). The desktop app bundles SQL judging — no network needed.");
      return;
    }
    let rows;
    try {
      const db = new SQL.Database();
      db.run(q.setup);
      const res = db.exec(val);
      db.close();
      rows = res && res.length ? res[0].values : [];
    } catch (e) {
      tried[qid] = (tried[qid] || 0) + 1;
      feedback(qid, false, (lang === "zh" ? "SQL 报错了：" : "SQL error: ") + String(e.message || e).slice(0, 160));
      if (tried[qid] >= 2) document.querySelector('[data-solve="' + qid + '"]').style.display = "inline-block";
      return;
    }
    const got = JSON.stringify(rows.map((r) => r.map((v) => (typeof v === "number" ? String(Number(v)) : String(v)))));
    if (got === JSON.stringify(q.expect)) {
      solved.add(qid);
      render();
      const card = document.querySelectorAll(".card")[QUIZ.findIndex((x) => x.id === qid)];
      if (card) setTimeout(() => card.scrollIntoView({ behavior: "smooth", block: "center" }), 60);
      if (solved.size === QUIZ.length) setTimeout(() => document.getElementById("cta").scrollIntoView({ behavior: "smooth", block: "center" }), 400);
      return;
    }
  }

  tried[qid] = (tried[qid] || 0) + 1;
  const extra = tried[qid] >= 2
    ? '<div class="solve" style="display:block"><b>' + t().answerIs + "</b><pre>" + esc(q.solution || q.answer) + "</pre></div>"
    : "";
  feedback(qid, false, q.hint[lang], extra);
  if (tried[qid] >= 2) document.querySelector('[data-solve="' + qid + '"]').style.display = "inline-block";
}

document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  document.documentElement.lang = lang;
  render();
});

render();
initSql().then((s) => { SQL = s; if (!s) console.warn("sql.js not ready"); });
</script>
</body>
</html>
